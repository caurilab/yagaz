# Mosquitto — configuration locale Yagaz
# Sécurité dès la fondation : pas d'accès anonyme, chaque plateau/worker
# s'authentifie. Le fichier passwd est généré hors dépôt (voir ops/README.md).

listener 1883
protocol mqtt

listener 9001
protocol websockets

# Pas d'anonyme : un plateau compromis ne peut pas se faire passer pour un autre
# sans identifiants.
allow_anonymous false
password_file /mosquitto/config/passwd

# ACL par appareil : chaque plateau ne publie que sur son propre topic
# (yagaz/v1/plateau/{son uid}/...). Voir ops/mosquitto/acl.
acl_file /mosquitto/config/acl

# Les mesures sont de petits messages JSON (ADR 0003). On plafonne la taille
# pour éviter qu'un plateau compromis ne sature la mémoire du worker (audit #4).
message_size_limit 1024

# --- TLS (production) ---
# En clair (1883/9001) les identifiants plateau transitent en clair : à réserver
# à un réseau de confiance en dev. En PRODUCTION, activer un listener TLS et
# désactiver le 1883 en clair (voir ADR 0007). Décommenter et fournir les certs :
#
# listener 8883
# protocol mqtt
# cafile   /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile  /mosquitto/config/certs/server.key
# # mTLS par appareil (recommandé) :
# # require_certificate true

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
