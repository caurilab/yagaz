# Mosquitto — configuration locale Yagaz
# Sécurité dès la fondation : pas d'accès anonyme, chaque plateau/worker
# s'authentifie. Le fichier passwd est généré hors dépôt (voir ops/README.md).

listener 1883
protocol mqtt

listener 9001
protocol websockets

# Pas d'anonyme : un plateau compromis ne peut pas se faire passer pour un autre
# sans identifiants. L'ACL par appareil sera ajoutée en Phase 2.
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
