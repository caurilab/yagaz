; Firmware du plateau Yagaz — ESP32
; Lecture des cellules de charge via HX711, lissage, publication MQTT.
; Chaîne de mesure complète implémentée en Phase 2 (voir src/main.cpp).

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bogde/HX711@^0.7.5
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
; Preferences.h (stockage NVS du calibrage et du compteur "seq") fait partie
; du core Arduino-ESP32 : pas de dépendance externe à ajouter.
; Les secrets (SSID Wi-Fi, identifiants MQTT) ne sont pas versionnés :
; copier src/secrets.example.h -> src/secrets.h (ignoré par git).
